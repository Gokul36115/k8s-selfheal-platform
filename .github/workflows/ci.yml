# CI: test -> lint chart -> build image -> push to GHCR -> smoke test.
# CI never writes to the repo. Releasing is a reviewed human step:
#   ./scripts/release.sh   (updates charts/selfheal/values.yaml -> Argo CD deploys it)
name: ci

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**", "charts/**"]

permissions:
  contents: read      # CI only reads the repo; it never commits
  packages: write     # to push to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Build and unit test
        working-directory: app
        run: ./mvnw -B -q clean package

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the Helm chart
        run: |
          helm lint charts/selfheal
          helm template selfheal charts/selfheal > /dev/null

  image:
    needs: [test, chart]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/selfheal-app" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the pushed image
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE:${GITHUB_SHA}"
          for i in $(seq 1 30); do curl -sf localhost:8080/actuator/health | grep -q UP && exit 0; sleep 3; done
          docker logs smoke; exit 1
      - name: Release instructions
        run: |
          echo "### Image ready: \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy it with: \`./scripts/release.sh ${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

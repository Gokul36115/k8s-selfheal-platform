apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "selfheal.name" . }}
  labels: {{- include "selfheal.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "selfheal.selector" . | nindent 6 }}

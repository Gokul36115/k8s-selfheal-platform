{{- if .Values.monitoring.dashboard }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "selfheal.name" . }}-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "selfheal.labels" . | nindent 4 }}
data:
  selfheal.json: |-
{{ .Files.Get "dashboards/selfheal.json" | indent 4 }}
{{- end }}

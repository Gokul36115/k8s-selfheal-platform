spring.application.name=selfheal-app

# Expose health (for Kubernetes probes) and prometheus (for metrics)
management.endpoints.web.exposure.include=health,info,prometheus
# /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# Tag every metric with the app name so dashboards can filter on it
management.metrics.tags.application=${spring.application.name}
# Percentile histograms let Prometheus compute p95 latency
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Graceful shutdown: finish in-flight requests during rolling updates
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
